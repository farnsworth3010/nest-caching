apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: nest-caching:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # The api asks these Sentinels for the current master (deploy/k8s/redis.yaml).
            - name: REDIS_SENTINELS
              value: redis-0.redis:26379,redis-1.redis:26379,redis-2.redis:26379
            - name: REDIS_MASTER_NAME
              value: mymaster
            - name: WEB_DIST
              value: /app/web/dist
          # HPA utilization is measured against requests.cpu.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Each pod seeds its own SQLite file on start, so it is not ready until that is done.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 3
            # CPU burns block the event loop for up to 500 ms (more when throttled).
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Keep serving while the Service removes this pod from its endpoints, then SIGTERM.
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # Default is 300 s; shorter so the demo shows scale-down within a couple of minutes.
    scaleDown:
      stabilizationWindowSeconds: 60
