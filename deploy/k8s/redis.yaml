# Redis master + 2 replicas + Sentinel, one Redis and one Sentinel per pod.
# shortcut: no AUTH and no TLS (cluster-internal only), add requirepass/masterauth before exposing it.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  # Headless: gives every pod a stable DNS name, redis-0.redis … redis-2.redis.
  clusterIP: None
  # Names must resolve before pods are ready, or replicas and Sentinels cannot find each other at start.
  publishNotReadyAddresses: true
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
    - name: sentinel
      port: 26379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-init
data:
  init.sh: |
    #!/bin/sh
    # Decides this pod's role: ask the other pods' Sentinels for the current master;
    # if none answers (first start), redis-0 is the master.
    set -eu

    SELF="$HOSTNAME.redis"

    ask() {
      for i in 0 1 2; do
        [ "redis-$i" = "$HOSTNAME" ] && continue
        m=$(timeout 2 redis-cli -h "redis-$i.redis" -p 26379 --raw SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1) || true
        [ -n "$m" ] && echo "$m" && return
      done
    }

    MASTER=$(ask) || true

    # Sentinels still name this pod: it was the master and came back before they failed over.
    # Starting as master now would make a second master until Sentinel demotes it, losing the writes it takes.
    # If no failover comes within 15 s (it was down too briefly), it stays master.
    if [ "$MASTER" = "$SELF" ]; then
      for _ in $(seq 15); do
        sleep 1
        m=$(ask) || true
        [ -n "$m" ] && [ "$m" != "$SELF" ] && MASTER=$m && break
      done
    fi

    [ -z "$MASTER" ] && MASTER="redis-0.redis"
    echo "self=$SELF master=$MASTER"

    # Sentinel refuses to start with a master name it cannot resolve.
    until getent hosts "$MASTER" > /dev/null; do sleep 1; done

    cat > /etc/redis/redis.conf <<EOF
    port 6379
    protected-mode no
    dir /data
    appendonly yes
    replica-announce-ip $SELF
    EOF

    [ "$MASTER" != "$SELF" ] && echo "replicaof $MASTER 6379" >> /etc/redis/redis.conf

    cat > /etc/redis/sentinel.conf <<EOF
    port 26379
    protected-mode no
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $SELF
    sentinel monitor mymaster $MASTER 6379 2
    sentinel down-after-milliseconds mymaster 3000
    sentinel failover-timeout mymaster 10000
    EOF
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 3
  # Pods start together; init.sh, not the start order, decides who is master.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      initContainers:
        - name: init
          image: redis:8.10.3
          command: ["sh", "/init/init.sh"]
          volumeMounts:
            - name: init
              mountPath: /init
            - name: conf
              mountPath: /etc/redis
      containers:
        - name: redis
          image: redis:8.10.3
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/redis
            - name: data
              mountPath: /data
        - name: sentinel
          image: redis:8.10.3
          # Sentinel rewrites its config file (known replicas, epochs), so it lives in the writable emptyDir.
          command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
          ports:
            - containerPort: 26379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/redis
      volumes:
        - name: init
          configMap:
            name: redis-init
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
